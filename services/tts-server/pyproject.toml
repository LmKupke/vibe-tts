[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vibe-tts-server"
version = "0.1.0"
description = "Optional local neural TTS service for Vibe TTS"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# Keep model stacks opt-in: installing the HTTP service must never download a
# framework or model checkpoint.
tada = [
  "hume-tada==0.1.9",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.3",
]
qwen = [
  "qwen-tts==0.1.1",
  "torch>=2.8,<3",
  "transformers==4.57.3",
  "accelerate==1.12.0",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
vibe-tts-server = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
